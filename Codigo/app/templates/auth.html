<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Auth UI - Pruebas</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/auth.css') }}">
</head>
<body>
  <main class="container">
    <h1>Pruebas de Autenticación</h1>

    <section class="card">
      <h2>Register</h2>
      <form id="register-form">
        <label for="reg-email">Correo electrónico</label>
        <input id="reg-email" name="email" placeholder="correo@ejemplo.com" required />

        <label for="reg-password">Contraseña</label>
        <input id="reg-password" name="password" type="password" placeholder="Contraseña" required />

        <label for="reg-username">Nombre de usuario</label>
        <input id="reg-username" name="username" placeholder="ej: juan123" required />

        <label for="reg-full-name">Nombre completo</label>
        <input id="reg-full-name" name="full_name" placeholder="ej: Juan Pérez" />

        <label for="reg-role">Rol</label>
        <select id="reg-role" name="role">
          <option value="estudiante">Estudiante</option>
          <option value="admin">Administrador</option>
        </select>

        <button type="submit">Registrarse</button>
      </form>
    </section>

    <section class="card">
      <h2>Login</h2>
      <form id="login-form">
        <input name="email" placeholder="Email" required />
        <input name="password" type="password" placeholder="Password" required />
        <button type="submit">Login</button>
      </form>
    </section>

    <section class="card actions">
      <button id="btn-logout">Logout</button>
      <button id="btn-me">Get /auth/me</button>
    </section>

    <section class="card">
      <h2>Output</h2>
      <pre id="output">(sin actividad)</pre>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/auth.js') }}"></script>

</body>
</html>
