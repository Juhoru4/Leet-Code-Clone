<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Problemas — LeetCode Clone</title>

</head>
<body>

  <header>
    <a class="logo" href="#">LeetCode Clone</a>
    <nav>
      <a href="#" class="active">Problemas</a>
    </nav>
  </header>

  <div class="container">
    <h1>Problemas</h1>

    <div id="error-msg"></div>

    <div class="toolbar">
      <label for="filtro-dificultad">Dificultad:</label>
      <!-- RF-02.6: el select recupera el filtro guardado en sessionStorage -->
      <select id="filtro-dificultad" onchange="guardarYCargar()">
        <option value="">Todos</option>
        <option value="facil">Fácil</option>
        <option value="medio">Medio</option>
        <option value="dificil">Difícil</option>
      </select>

      <span class="stats" id="contador"></span>
    </div>

    <table id="tabla-problemas">
      <thead>
        <tr>
          <th>#</th>
          <th>Título</th>
          <th>Categoría</th>
          <th>Dificultad</th>
          <th>Estado</th>
        </tr>
      </thead>
      <tbody id="cuerpo-tabla">
        <tr>
          <td colspan="5" id="loading">Cargando problemas…</td>
        </tr>
      </tbody>
    </table>
  </div>

  

</body>
</html>
