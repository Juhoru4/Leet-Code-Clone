{% extends "base.html" %}

{% block title %}Problemas - CodeChallenge{% endblock %}

{% block content %}
<section class="max-w-7xl mx-auto space-y-12">
  <div class="space-y-4">
    <p class="text-xs uppercase tracking-[0.2em] text-slate-500">Explora</p>
    <h1 class="font-extrabold tracking-tight text-white text-4xl md:text-6xl">
      Catálogo de
      <span class="bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-sky-400 to-emerald-400">problemas</span>
    </h1>
    <p class="max-w-2xl text-base text-slate-400 leading-relaxed">
      Filtra por dificultad y resuelve retos en una interfaz limpia, rápida y consistente.
    </p>
  </div>

  <div id="error-msg" class="hidden rounded-2xl border border-red-800/60 bg-red-950/30 text-red-300 px-5 py-4"></div>

  <div class="bg-slate-900/60 backdrop-blur-xl border border-slate-800/50 rounded-3xl p-5 sm:p-8">
    <div class="flex flex-col md:flex-row md:items-end md:justify-between gap-4 mb-6">
      <div class="flex items-end gap-3">
        <div>
          <label for="filtro-dificultad" class="block text-sm text-slate-300 mb-2">Dificultad</label>
          <select id="filtro-dificultad" class="rounded-xl border border-slate-700 bg-slate-900/50 px-4 py-2 text-slate-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="guardarYCargar()">
            <option value="">Todos</option>
            <option value="facil">Fácil</option>
            <option value="medio">Medio</option>
            <option value="dificil">Difícil</option>
          </select>
        </div>
      </div>
      <span id="contador" class="text-sm text-slate-500"></span>
    </div>

    <div class="overflow-x-auto">
      <table id="tabla-problemas" class="min-w-full text-left">
        <thead>
          <tr class="border-b border-slate-800/80">
            <th class="px-4 py-3 text-xs uppercase tracking-widest text-slate-500">#</th>
            <th class="px-4 py-3 text-xs uppercase tracking-widest text-slate-500">Título</th>
            <th class="px-4 py-3 text-xs uppercase tracking-widest text-slate-500">Categoría</th>
            <th class="px-4 py-3 text-xs uppercase tracking-widest text-slate-500">Dificultad</th>
            <th class="px-4 py-3 text-xs uppercase tracking-widest text-slate-500">Estado</th>
          </tr>
        </thead>
        <tbody id="cuerpo-tabla">
          <tr>
            <td colspan="5" id="loading" class="px-4 py-12 text-center text-slate-500">Cargando problemas...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</section>

<script>
  const DIFICULTAD_LABELS = { facil: 'Fácil', medio: 'Medio', dificil: 'Difícil' };
  const ORDEN_DIFICULTAD = { facil: 0, medio: 1, dificil: 2 };

  window.addEventListener('DOMContentLoaded', () => {
    const filtroGuardado = sessionStorage.getItem('filtro-dificultad') || '';
    document.getElementById('filtro-dificultad').value = filtroGuardado;
    cargarProblemas(filtroGuardado);
  });

  function guardarYCargar() {
    const dificultad = document.getElementById('filtro-dificultad').value;
    sessionStorage.setItem('filtro-dificultad', dificultad);
    cargarProblemas(dificultad);
  }

  function badgeDificultadClass(dificultad) {
    if (dificultad === 'facil') return 'bg-green-500/10 text-green-400 border border-green-600/30';
    if (dificultad === 'medio') return 'bg-amber-500/10 text-amber-400 border border-amber-600/30';
    if (dificultad === 'dificil') return 'bg-red-500/10 text-red-400 border border-red-600/30';
    return 'bg-slate-700/20 text-slate-300 border border-slate-600/30';
  }

  function badgeEstadoClass(activo) {
    return activo
      ? 'bg-emerald-500/10 text-emerald-400 border border-emerald-600/30'
      : 'bg-slate-700/30 text-slate-400 border border-slate-600/30';
  }

  async function cargarProblemas(dificultad) {
    const tbody = document.getElementById('cuerpo-tabla');
    const errorDiv = document.getElementById('error-msg');
    const contador = document.getElementById('contador');

    tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-12 text-center text-slate-500">Cargando...</td></tr>';
    errorDiv.classList.add('hidden');

    let url = '/api/problems';
    if (dificultad) url += '?difficulty=' + encodeURIComponent(dificultad);

    try {
      const res = await fetch(url);
      if (!res.ok) throw new Error('Error del servidor: ' + res.status);
      const problemas = await res.json();

      const disponibles = problemas.filter((p) => p.esta_activo !== false);
      if (disponibles.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" class="px-4 py-12 text-center text-slate-500">No hay problemas con ese filtro.</td></tr>';
        contador.textContent = '';
        return;
      }

      contador.textContent = disponibles.length + ' problema(s)';

      const porCategoria = {};
      disponibles.forEach((p) => {
        const cat = p.categoria || 'Sin categoría';
        if (!porCategoria[cat]) porCategoria[cat] = [];
        porCategoria[cat].push(p);
      });

      Object.values(porCategoria).forEach((grupo) => {
        grupo.sort((a, b) => (ORDEN_DIFICULTAD[a.dificultad] ?? 99) - (ORDEN_DIFICULTAD[b.dificultad] ?? 99));
      });

      let filas = '';
      let contadorGlobal = 1;

      Object.entries(porCategoria).forEach(([categoria, grupo]) => {
        filas += `
          <tr>
            <td colspan="5" class="px-4 py-2 text-[11px] uppercase tracking-[0.15em] text-slate-500 bg-slate-950/50 border-y border-slate-800/80">${escapeHtml(categoria)}</td>
          </tr>`;

        grupo.forEach((p) => {
          const label = DIFICULTAD_LABELS[p.dificultad] || p.dificultad || '—';
          const estadoLabel = p.esta_activo ? 'Disponible' : 'No disponible';

          filas += `
            <tr class="border-b border-slate-800/60 hover:bg-slate-800/30 transition-colors">
              <td class="px-4 py-4 text-slate-500">${contadorGlobal++}</td>
              <td class="px-4 py-4">
                <a class="text-slate-100 hover:text-indigo-300 transition-colors font-medium" href="/problems/${encodeURIComponent(p.id)}/ui">${escapeHtml(p.titulo)}</a>
              </td>
              <td class="px-4 py-4">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs border border-slate-700 text-slate-300 bg-slate-800/40">${escapeHtml(p.categoria || '—')}</span>
              </td>
              <td class="px-4 py-4">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs ${badgeDificultadClass(p.dificultad)}">${label}</span>
              </td>
              <td class="px-4 py-4">
                <span class="inline-flex items-center px-3 py-1 rounded-full text-xs ${badgeEstadoClass(p.esta_activo)}">${estadoLabel}</span>
              </td>
            </tr>`;
        });
      });

      tbody.innerHTML = filas;
    } catch (err) {
      errorDiv.textContent = 'No se pudo cargar la lista de problemas. (' + err.message + ')';
      errorDiv.classList.remove('hidden');
      tbody.innerHTML = '';
      contador.textContent = '';
    }
  }

  function escapeHtml(str) {
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;');
  }
</script>
{% endblock %}
